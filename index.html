<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>Return to SLAM Society</title>
<style>body{font:16px system-ui,sans-serif;margin:12vh auto;padding:0 20px;max-width:480px;line-height:1.5}#return{display:inline-block;border:0;padding:14px 20px;border-radius:6px;background:#d9364b;color:white;font:inherit;text-decoration:none;cursor:pointer}#return[hidden]{display:none}</style>
</head>
<body>
<h1>Connect your SLAM account</h1>
<p id="message" role="status">Checking your Wix sign-in…</p>
<a id="return" hidden>Return to SLAM Society app</a>
<script>
(() => {
  const status = document.getElementById('message');
  const button = document.getElementById('return');
  const params = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  const code = params.get('code');
  const state = params.get('state');
  if (params.has('error')) {
    status.textContent = 'Wix sign-in was cancelled or did not succeed. Return to SLAM and try again.';
    return;
  }
  if (!code || code.length < 8 || code.length > 4096 ||
      !state || !/^[a-zA-Z0-9_-]{43,128}$/.test(state)) {
    status.textContent = 'The Wix sign-in response was incomplete. Please try again from the SLAM app.';
    return;
  }
  const appUrl = new URL('slamsociety://wix-callback');
  appUrl.searchParams.set('code', code);
  appUrl.searchParams.set('state', state);
  status.textContent = 'Wix sign-in complete. Return to your SLAM app to finish connecting your account.';
  button.href = appUrl.href;
  button.hidden = false;
})();
</script>
</body>
</html>
